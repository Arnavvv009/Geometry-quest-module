kind = "web"
previewPath = "/"
title = "GeoQuest — Gamified Geometry Platform"
version = "1.0.0"
id = "artifacts/geoquest"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19515

[services.development]
run = "pnpm --filter @workspace/geoquest run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/geoquest", "run", "build" ]
publicDir = "artifacts/geoquest/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19515"
BASE_PATH = "/"
